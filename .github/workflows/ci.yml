name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check git whitespace
        run: git diff --check

      - name: Check for committed secrets
        run: npm run check:secrets

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Install dependencies
        run: npm ci

      - name: Check nullable default-parameter safety
        run: npm run check:nullable-defaults

      - name: Check product resolver contract
        run: npm run check:resolver-contract

      - name: Run behavioral tests with coverage
        run: npm run test:coverage

      - name: Check catalog quality
        run: npm run check:catalog

      - name: Check catalog scraper contract
        run: npm run check:catalog-scraper

      - name: Check CI release alignment
        run: npm run check:ci

      - name: Check GitHub release audit
        run: npm run check:github-release

      - name: Check analytics privacy
        run: npm run check:analytics

      - name: Check App Privacy disclosure
        run: npm run check:privacy

      - name: Check accessibility labels
        run: npm run check:accessibility

      - name: Check pet-profile safety behavior
        run: npm run check:pet-safety

      - name: Check claim safety
        run: npm run check:claims

      - name: Check App Store listing
        run: npm run check:listing

      - name: Check App Store screenshots
        run: npm run check:appstore-screenshots

      - name: Check EAS versioning
        run: npm run check:eas-versioning

      - name: Check RevenueCat readiness
        run: npm run check:revenuecat

      - name: Check SQL migrations
        run: npm run check:sql

      - name: Check KPI runbook
        run: npm run check:kpi

      - name: Check deployment readiness
        run: npm run check:deployment

      - name: Check release evidence structure
        run: npm run check:evidence

      - name: Check native crash reporting gate
        run: npm run check:crash-reporting

      - name: Check Edge Functions
        run: npm run check:edge

      - name: Check Edge Function types
        run: npm run check:edge-types

      - name: Run Edge request-boundary tests
        run: npm run test:edge-requests

      - name: Fingerprint Edge Functions
        run: npm run edge:fingerprint

      - name: Dry-run live Edge verifier
        run: npm run edge:verify-live -- --dry-run

      - name: Dry-run live Auth verifier
        run: npm run auth:verify-live -- --dry-run

      - name: Check production dependency audit threshold
        run: npm run check:audit

      - name: Check production dependency licenses
        run: npm run check:licenses

      - name: Detect live catalog credentials
        id: catalog_credentials
        env:
          HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          if [ "$HAS_SUPABASE_URL" = "true" ] && [ "$HAS_SUPABASE_SERVICE_ROLE_KEY" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check catalog completeness
        if: ${{ steps.catalog_credentials.outputs.available == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run check:catalog-completeness

      - name: Check Expo package versions
        run: npm run check:expo-versions

      - name: Check Expo config
        run: npm run check:expo-config

      - name: Check Expo bundle export
        run: npm run check:bundle

      - name: Check Expo native prebuild
        run: npm run check:prebuild

      - name: Check release metadata
        run: npm run check:release

  database:
    name: Disposable Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:db

  ios-storekit:
    name: Native StoreKit contract
    runs-on: macos-15
    env:
      # StoreKitTest mutations are broken under headless xcodebuild with the
      # iOS 26.2+ simulator runtimes (SKInternalErrorDomain Code 3). Keep this
      # job on the last working runner-provided Xcode/runtime pair.
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the iOS project and StoreKit test target
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_ANON_KEY: ci-supabase-anon-placeholder
          REVENUECAT_API_KEY_IOS: ci-revenuecat-ios-placeholder
          REVENUECAT_API_KEY_ANDROID: ci-revenuecat-android-placeholder
          SENTRY_DSN: https://public@sentry.example/1
          SENTRY_ORG: ci-sentry-org
          SENTRY_PROJECT: ci-sentry-project
          SENTRY_AUTH_TOKEN: sntrys_ci_test_token_1234567890
          GOOGLE_WEB_CLIENT_ID: ci-google-client-placeholder
          WOOF_SHARE_URL: https://apps.apple.com/app/id6760733899
          EAS_BUILD: "true"
          EAS_BUILD_PROFILE: preview
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          IOS_RUNTIME_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          export IOS_RUNTIME_VERSION
          DEVICE_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices")
            runtime_token = ENV.fetch("IOS_RUNTIME_VERSION").tr(".", "-")
            runtime = devices.keys.find { |key| key.end_with?("iOS-#{runtime_token}") }
            abort "No simulator runtime matches iOS #{ENV.fetch("IOS_RUNTIME_VERSION")}" unless runtime
            phone = devices.fetch(runtime).find { |device| device.fetch("name").start_with?("iPhone") }
            abort "No available iPhone simulator" unless phone
            puts phone.fetch("udid")
          ')"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Execute the native StoreKit catalog tests
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: >-
          xcodebuild test
          -workspace ios/woof.xcworkspace
          -scheme "woof StoreKit"
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          -only-testing:woofTests/WoofConfigurationTests
          CODE_SIGNING_ALLOWED=NO
